# @package _global_
task:
  name: steering_validation
  run_tag: default
  
  # Base directory containing "cot_lat", "cot_pca", etc. subfolders
  # e.g. results/subspace_gaze/Qwen3-30B-A3B-Instruct-2507_custom_60/Qwen3-30B-A3B-Instruct-2507_gpt2
  vector_base_dir: ??? 
  
  concept: ??? # Concept name (e.g. dog)
  
  # List of concept types to test
  concept_types: 
    - cot_lat
    - cot_diff_mean
    - cot_pca
    
  # List of layer indices to test (e.g. [0, 1, ..., 11])
  layer_indices: [6]
  
  # List of layer component types
  layer_types: 
    - attn.c_proj
    - mlp.c_proj
  
  # Vector varieties to test
  vector_suffixes:
    - masked
    - global
    - killed
    
  coeff_start: -5.0
  coeff_end: 20.0
  coeff_steps: 20
  
  max_new_tokens: 40
  num_samples: 3 # Number of samples per prompt per coefficient
  seed: 42
